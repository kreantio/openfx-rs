[objects]
unused_property_sets_in_metadata = ["ParamsNormalizedSpatial"]

[objects.mapping]
# source: https://openfx.readthedocs.io/en/main/Reference/ofxImageEffectAPI.html#main-objects-used-by-the-api
#
# The keys follows `openfx/openfx-cpp/include/openfx/ofxPropsBySet.h`.
# The names in the comments follows the source.

EffectDescriptor = { is = "OfxImageEffectHandle", set = true }    # Image Effect Descriptor
EffectInstance = { is = "OfxImageEffectHandle", set = true }      # Image Effect Instance
ClipDescriptor = { is = "OfxImageClipHandle", set = true }        # Clip Descriptor
ClipInstance = { is = "OfxImageClipHandle", set = true }          # Clip Instance
ParameterSetDescriptor = { is = "OfxParamSetHandle", set = true } # Parameter Set Descriptor
ParameterSetInstance = { is = "OfxParamSetHandle", set = true }   # Parameter Set Instance
InteractDescriptor = { is = "OfxInteractHandle", set = true }     # Interact Descriptor
InteractInstance = { is = "OfxInteractHandle", set = true }       # Interact Instance

# source: same as the above.

# Host Descriptor: This is just a property set handle.
ImageEffectHost = { is = "OfxPropertySetHandle", omit = true }
# Parameter Descriptor/Instance: Concrete parameter descriptors/instances are
# used instead.
ParamsDescriptor = { is = "OfxParamHandle", omit = true }
# Image Instance: This is also a property set handle, so we need to handle this
# specifically.
Image = { is = "OfxPropertySetHandle", omit = true }

# remain

# concrete properties are used instead.
PropertySet = { is = "OfxPropertySetHandle", omit = true }
DrawContext = "OfxDrawContextHandle"
ImageMemory = "OfxImageMemoryHandle"
Mutex = "OfxMutexHandle"

[objects.parameter_set_mapping]
# sources:
# - `openfx/openfx-cpp/include/openfx/ofxPropsBySet.h`'s `prop_sets`
# - `openfx/include/ofxParam.h`'s defines that start with `kOfxParamType`
# - `openfx/include/ofxParametricParam.h`'s defines that start with
#   `kOfxParamType`.
#
# The keys follows the defines mentioned in the sources above (with the prefix
# `"kOfx"` and the infix `"Type"` removed).
ParamInteger = { is = "OfxParamHandle", set = "ParamsByte", d = 1, ty = "Int" }           # I guess? 
ParamDouble = { is = "OfxParamHandle", set = "ParamDouble1D", d = 1, ty = "Double" }
ParamBoolean = { is = "OfxParamHandle", set = "ParamsByte", d = 1, ty = "Bool" }          # I guess? 
ParamChoice = { is = "OfxParamHandle", set = "ParamsByte", d = 1, ty = "Int" }            # I guess? 
ParamStrChoice = { is = "OfxParamHandle", set = "ParamsStrChoice", d = 1, ty = "String" }
ParamRGBA = { is = "OfxParamHandle", set = "ParamDouble2D3D", d = 4, ty = "Double" }
ParamRGB = { is = "OfxParamHandle", set = "ParamDouble2D3D", d = 3, ty = "Double" }
ParamDouble2D = { is = "OfxParamHandle", set = "ParamDouble2D3D", d = 2, ty = "Double" }
ParamInteger2D = { is = "OfxParamHandle", set = "ParamsInt2D3D", d = 2, ty = "Int" }
ParamDouble3D = { is = "OfxParamHandle", set = "ParamDouble2D3D", d = 3, ty = "Double" }
ParamInteger3D = { is = "OfxParamHandle", set = "ParamsInt2D3D", d = 3, ty = "Int" }
ParamString = { is = "OfxParamHandle", set = "ParamsString", d = 1, ty = "String" }
ParamCustom = { is = "OfxParamHandle", set = "ParamsCustom", d = 1, ty = "Custom" }
ParamBytes = { is = "OfxParamHandle", set = "ParamsBytes", d = 1, ty = "Pointer" }
ParamGroup = { is = "OfxParamHandle", set = "ParamsGroup", d = 0, ty = "" }
ParamPage = { is = "OfxParamHandle", set = "ParamsPage", d = 0, ty = "" }
ParamPushButton = { is = "OfxParamHandle", set = "ParamsPushButton", d = 0, ty = "" }
ParamParametric = { is = "OfxParamHandle", set = "ParamsParametric", d = 0, ty = "" }

[property_names]
simple_names_regex = "^Ofx(.*?)(?:Prop)(.+)$"
[property_names.simple_names_special_cases]
# action args: no `"Prop"`
OfxImageEffectFrameVarying = "ImageEffectFrameVarying"
# property sets: no `"Prop"`
OfxImageEffectPluginRenderThreadSafety = "ImageEffectPluginRenderThreadSafety"

