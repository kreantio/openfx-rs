[workspace]
resolver = "3"
members = [
  "xtask",
  "crates/openfx",
  "crates/openfx-internal-macros",
  "crates/private/openfx-codegen",
  "examples/ofx-guide-example-plugins-layer-low",
  "crates/private/openfx-codegen-config",
]
# for some reason, globs (e.g. "vendor/*", "vendor/**/*") don't work.
exclude = [
  "vendor/openfx-data/openfx-datagen/crates/openfx-datagen",
  "vendor/openfx-data/openfx-datagen/crates/openfx-bindgen",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.7.0"
license = "BSD-3-Clause"
repository = "https://github.com/kreantio/openfx-rs"

[workspace.lints]

[workspace.dependencies]
openfx = { path = "crates/openfx", version = "0.7.0" }
openfx-codegen = { path = "crates/private/openfx-codegen", version = "0.7.0" }
openfx-codegen-config = { path = "crates/private/openfx-codegen-config", version = "0.7.0" }
openfx-internal-macros = { path = "crates/openfx-internal-macros", version = "0.7.0" }

openfx-datagen = { path = "vendor/openfx-data/openfx-datagen/crates/openfx-datagen", version = "0.6.0" }

clap = "4.6.6"
convert_case = "0.11.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rayon = "1.12.0"
regex = "1.13.1"
serde = "1.0.229"
serde_json = "1.0.151"
serde-saphyr = "2.0.0"
snafu = "0.9.2"
syn = "3.0.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
